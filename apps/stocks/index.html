<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="Learn how shares, orders, diversification and margin work on simulated stock charts you can step through and stress-test."

    <meta name="theme-color" content="#ebe7e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />

      } catch (e) {}
    </script>
  </head>
